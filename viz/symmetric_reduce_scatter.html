<style>
  :root{
    --bg:#0d1117; --panel:#131923; --panel2:#19212e; --line:#263043;
    --text:#e6edf3; --muted:#8b949e; --accent:#76b900; --amber:#f2a541; --blue:#58a6ff;
    --mono:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:Inter,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  header{display:flex;align-items:baseline;gap:18px;padding:16px 24px 6px;flex-wrap:wrap}
  .brand{font-size:19px;font-weight:700;letter-spacing:.2px}
  .brand .dot{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--accent);margin-right:8px;transform:translateY(-1px)}
  .sub{color:var(--muted);font-size:12.5px}

  nav{display:flex;gap:6px;padding:8px 24px 0;flex-wrap:wrap;border-bottom:1px solid var(--line)}

  nav button:hover{color:var(--text)}
  nav button.on{color:var(--text);background:var(--panel);border-color:var(--line);

  main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:0;min-height:calc(100vh - 110px)}
  .stage{padding:12px 16px 16px 24px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
  #sceneControls{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);min-height:4px}
  #sceneControls label{display:flex;gap:6px;align-items:center}
  #sceneControls select,#sceneControls input[type=number]{background:var(--panel2);color:var(--text);
    border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-family:inherit;font-size:12.5px}
  #sceneControls input[type=number]{width:58px}
  .svgwrap{background:#0b0f15;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  svg{display:block;width:100%;height:auto}
  .controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .controls button{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit;min-width:42px}
  .controls button:hover{border-color:#3d4b63}
  .controls button.primary{background:var(--accent);color:#0b0f15;border-color:var(--accent);font-weight:700;min-width:96px}
  .progress{display:flex;gap:5px;align-items:center;margin:0 10px;flex-wrap:wrap}

  .controls label{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:6px;margin-left:auto}
  .controls .kbd{color:var(--muted);font-size:11.5px}
  aside{border-left:1px solid var(--line);padding:18px 20px;overflow:auto;max-height:calc(100vh - 110px);position:sticky;top:0}
  .stepno{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.5px}

  pre{background:#0b0f15;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--mono);
    font-size:11.5px;line-height:1.6;color:#c9d1d9;white-space:pre-wrap;word-break:break-word;margin:6px 0 0}
  #legend{margin-top:16px;font-size:12px;color:var(--muted);line-height:1.8}
  #legend .sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;transform:translateY(1px)}
  @media (max-width:1100px){main{grid-template-columns:1fr} aside{max-height:none;border-left:none;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>NCCL Symmetric ReduceScatter</div>
  <div class="sub">kernel 通信 / 计算过程交互演示 · 源码 <code>src/device/symmetric/reduce_scatter.cuh</code>、<code>reduce_scatter_gin.cuh</code></div>

<nav id="tabs"></nav>
<main>
  <section class="stage">

<script>
"use strict";
/* ============================== 基础工具 ============================== */
const NS = "http://www.w3.org/2000/svg";
const COL = { card:"#151c28", cardS:"#2a3446", text:"#e6edf3", muted:"#8b949e", dim:"#3a4558",
  accent:"#76b900", amber:"#f2a541", blue:"#58a6ff", red:"#ef6b8a", violet:"#b48cff", band:"#101723", bandS:"#22314a" };
const C4 = ["#58a6ff", "#f2a541", "#5cc98a", "#ef6b8a"];
function c12(r){ const n = r >> 2, g = r & 3; const H = [212, 145, 28][n]; const Lt = [42, 53, 64, 75][g]; return `hsl(${H},72%,${Lt}%)`; }

function E(tag, attrs, parent, text){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function R(g, x, y, w, h, fill, o = {}){
  return E("rect", { x, y, width: w, height: h, rx: o.rx ?? 6, fill: fill || "none",
    stroke: o.stroke || "none", "stroke-width": o.sw || 1, opacity: o.op ?? 1,
    "stroke-dasharray": o.dash || undefined }, g);
}
function T(g, x, y, txt, o = {}){
  return E("text", { x, y, fill: o.fill || COL.text, "font-size": o.size || 12, "text-anchor": o.anchor || "start",
    "font-weight": o.weight || 400, "font-family": o.mono ? "JetBrains Mono,SF Mono,Menlo,monospace" : undefined,
    opacity: o.op ?? 1 }, g, txt);
}
function card(g, x, y, w, h, o = {}){ return R(g, x, y, w, h, COL.card, { stroke: o.stroke || COL.cardS, sw: o.sw || 1, rx: 10 }); }
function stripes(g, x, y, w, h, colors){
  const n = colors.length; const sw = w / n;
  colors.forEach((c, i) => R(g, x + i * sw, y, sw + 0.4, h, c, { rx: 0 }));
  R(g, x, y, w, h, "none", { stroke: "#ffffff55", rx: 3 });
}
function emptyBox(g, x, y, w, h, label){
  R(g, x, y, w, h, "none", { stroke: COL.dim, dash: "4 3", rx: 5 });
  if (label) T(g, x + w / 2, y + h / 2 + 4, label, { anchor: "middle", size: 10.5, fill: COL.muted });
}
function pill(g, x, y, w, h, text, color){
  R(g, x, y, w, h, color + "22", { stroke: color, rx: h / 2 });
  T(g, x + w / 2, y + h / 2 + 4, text, { anchor: "middle", size: 10.5, fill: color, weight: 600 });
}

/* 路径：统一为折线点集（贝塞尔先采样） */
function cubic(p0, c1, c2, p3, n = 36){
  const pts = [];
  for (let i = 0; i <= n; i++){ const t = i / n, u = 1 - t;
    pts.push([u*u*u*p0[0] + 3*u*u*t*c1[0] + 3*u*t*t*c2[0] + t*t*t*p3[0],
              u*u*u*p0[1] + 3*u*u*t*c1[1] + 3*u*t*t*c2[1] + t*t*t*p3[1]]); }
  return pts;
}
const arc   = (p0, p3, top) => cubic(p0, [p0[0], top], [p3[0], top], p3);
const hcurve= (p0, p3) => { const mx = (p0[0] + p3[0]) / 2; return cubic(p0, [mx, p0[1]], [mx, p3[1]], p3); };
const vcurve= (p0, p3) => { const my = (p0[1] + p3[1]) / 2; return cubic(p0, [p0[0], my], [p3[0], my], p3); };
const flow  = (pts, color, o = {}) => Object.assign({ pts, color }, o);

function prepFlow(f){
  if (f._d) return;
  const cum = [0];
  for (let i = 1; i < f.pts.length; i++){ const a = f.pts[i - 1], b = f.pts[i]; cum.push(cum[i - 1] + Math.hypot(b[0] - a[0], b[1] - a[1])); }
  f._cum = cum; f._len = cum[cum.length - 1] || 1;
  f._d = "M" + f.pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L");
}
function posAt(f, u){
  const L = u * f._len, c = f._cum;
  let i = 1; while (i < c.length - 1 && c[i] < L) i++;
  const a = f.pts[i - 1], b = f.pts[i]; const seg = (c[i] - c[i - 1]) || 1; const k = Math.max(0, Math.min(1, (L - c[i - 1]) / seg));
  return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
}
const ease = u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;

function mkFlowEls(ov, f){
  prepFlow(f);
  const w = f.w || (f.thin ? 1 : 2.2);
  const path = E("path", { d: f._d, fill: "none", stroke: f.color, "stroke-width": w, "stroke-linecap": "round",
    "stroke-linejoin": "round", "stroke-dasharray": f.dash || `${f._len} ${f._len}`, "stroke-dashoffset": f.dash ? 0 : f._len }, ov);
  const end = E("circle", { r: f.thin ? 1.8 : 3.2, fill: f.color, opacity: 0 }, ov);
  const [ex, ey] = f.pts[f.pts.length - 1]; end.setAttribute("cx", ex); end.setAttribute("cy", ey);
  const pk = E("circle", { r: f.r || (f.thin ? 2.6 : 5.5), fill: f.color, stroke: "#fff", "stroke-width": f.thin ? .5 : 1.4, opacity: 0 }, ov);
  let lab = null;
  if (f.label){
    const [lx, ly] = posAt(f, f.labelAt ?? .5);
    lab = E("g", { opacity: 0 }, ov);
    const tw = f.label.length * 6.4 + 12;
    R(lab, lx - tw / 2 + (f.labelDx || 0), ly - 22 + (f.labelDy || 0), tw, 17, "#0b0f15", { stroke: f.color, rx: 4, op: .92 });
    T(lab, lx + (f.labelDx || 0), ly - 10 + (f.labelDy || 0), f.label, { anchor: "middle", size: 10.5, fill: f.color, weight: 600 });
  }
  return { path, pk, end, lab };
}
function updFlow(f, el, p, final){
  const d = f.delay || 0;
  const u = final ? 1 : ease(Math.max(0, Math.min(1, (p - d) / (1 - d))));
  el.path.setAttribute("stroke-opacity", f.thin ? .28 : (final ? .55 : .7));
  if (!f.dash) el.path.setAttribute("stroke-dashoffset", f._len * (1 - u));
  if (final){ el.pk.setAttribute("opacity", 0); el.end.setAttribute("opacity", f.thin ? .5 : .9); }
  else { const [x, y] = posAt(f, u); el.pk.setAttribute("cx", x); el.pk.setAttribute("cy", y); el.pk.setAttribute("opacity", u <= 0 || u >= 1 ? (u >= 1 ? .9 : 0) : 1); }
  if (el.lab) el.lab.setAttribute("opacity", final ? .95 : Math.min(1, u * 3));
}

/* ============================== 场景 1：单机 LD ============================== */
const sLD = {
  id: "ld", tab: "① 单机 LD（拉取式）", vb: [1100, 640],
  layout(){
    const G = [];
    for (let i = 0; i < 4; i++){
      const x = 40 + i * 262, y = 150;
      G.push({ x, y, w: 240, h: 252,
        cell: k => ({ x: x + 14 + k * 54, y: y + 52, w: 48, h: 34 }),
        bar: { x: x + 14, y: y + 100, w: 212, h: 22 },
        sq: k => ({ x: x + 14 + k * 38, y: y + 154, w: 30, h: 30 }),
        out: { x: x + 14, y: y + 212, w: 212, h: 28 } });
    }
    return { G };
  },
  init(){ return { bar: ["", "", "", ""], acc: [[], [], [], []], out: [null, null, null, null] }; },
  draw(svg, s, L){
    T(svg, 40, 38, "ReduceScatter_LD：每个 rank 用 NVLink 直接 load 所有 peer 输入中“属于自己的那一段”，在寄存器里规约后只写本地", { size: 15, weight: 700 });
    T(svg, 40, 62, "nRanks = 4；out_r = Σ_i in_i[seg r]；peer 访问顺序 r → r+1 → r+2 → …（ring 错开，同一时刻每张卡只被一个 rank 读）", { size: 12.5, fill: COL.muted });
    R(svg, 28, 124, 1044, 296, COL.band, { stroke: COL.bandS, dash: "5 4", rx: 14 });
    T(svg, 1062, 412, "NVLink / NVSwitch（LSA 域）：任意两卡可直接 P2P load/store", { anchor: "end", size: 11, fill: COL.muted });
    L.G.forEach((g, i) => {
      card(svg, g.x, g.y, g.w, g.h);
      T(svg, g.x + 14, g.y + 26, `GPU ${i}`, { size: 16, weight: 700, fill: C4[i] });
      T(svg, g.x + 80, g.y + 26, `rank ${i} · 负责 seg ${i}`, { size: 11.5, fill: COL.muted });
      T(svg, g.x + 14, g.y + 46, "input（symmetric window）", { size: 10.5, fill: COL.muted });
      for (let k = 0; k < 4; k++){ const c = g.cell(k);
        R(svg, c.x, c.y, c.w, c.h, C4[i], { op: .88, rx: 4 });
        T(svg, c.x + c.w / 2, c.y + 22, `seg${k}`, { anchor: "middle", size: 11, fill: "#0b0f15", weight: 700 }); }
      const B = { "": ["LSA barrier：—", COL.dim], arrived: ["bar.arrive ✓（relaxed）", COL.amber],
        passed: ["bar.wait ✓（acquire）", COL.accent], end: ["bar.sync ✓ 可安全返回", COL.blue] }[s.bar[i]];
      pill(svg, g.bar.x, g.bar.y, g.bar.w, g.bar.h, B[0], B[1] === COL.dim ? "#6e7681" : B[1]);
      T(svg, g.x + 14, g.y + 148, "acc（寄存器）· 已累加的来源 rank", { size: 10.5, fill: COL.muted });
      for (let k = 0; k < 4; k++){ const q = g.sq(k); const has = s.acc[i].includes(k);
        if (has) R(svg, q.x, q.y, q.w, q.h, C4[k], { rx: 4 }); else emptyBox(svg, q.x, q.y, q.w, q.h);
        T(svg, q.x + q.w / 2, q.y + 19, `r${k}`, { anchor: "middle", size: 10, fill: has ? "#0b0f15" : COL.muted, weight: 700 }); }
      T(svg, g.x + 14, g.y + 206, "out（本地 HBM）", { size: 10.5, fill: COL.muted });
      if (s.out[i]){ stripes(svg, g.out.x, g.out.y, g.out.w, g.out.h, s.out[i].map(k => C4[k]));
        T(svg, g.out.x + g.out.w / 2, g.out.y + 19, `Σ seg${i} 完成`, { anchor: "middle", size: 11.5, fill: "#0b0f15", weight: 700 }); }
      else emptyBox(svg, g.out.x, g.out.y, g.out.w, g.out.h, "—");
    });
    tilingFigure(svg, 40, 452);
  },
  steps: [
    { title: "初始状态：输入布局与语义",
      desc: `每张卡的 input 有 <b>nRanks 段</b>，rank r 只需要所有卡 <b>seg r</b> 的规约结果。<br>
      输入在 symmetric window 中注册过，所以在<b>同一偏移</b>上可以用 <code>peerPtr(world, r)</code> 直接访问 peer 显存，不经过 proxy 或 FIFO。<br>
      LD 是<b>拉取式</b>：每个 rank 自己去读 peer 的 seg r，只在本地写一次 out。NVLink 上全是读流量。<br>
      下方小图是一段 seg 内部的切分方式和 warp 映射。`,
      code: `// ncclSymkRun_ReduceScatter_LD_impl
handler.forEachWork<T>([&](int block, int nBlocks, size_t nElts,
                           size_t nAllElts, ncclSymPtr<T> input, ncclSymPtr<T> output) {
  int t  = flattenIx(lane, 32, block, nBlocks, warp, nWarps);
  int tn = nBlocks * blockDim.x;
  reduce<...>(handler, tn, t, nBlocks, waitNeeded, bar, red,
              input + rank * nAllElts,   // 只处理属于本 rank 的 seg
              output, nElts);
});` },
    { title: "① 所有 block：bar.arrive（relaxed）",
      desc: `kernel 一开头先 <code>bar.arrive</code>，只对外宣告“我的输入已经可以被读”，<b>不等待</b>其他卡。真正的 wait 推迟到读 peer 之前再做。`,
      code: `ncclLsaBarrierSession<ncclCoopCta> bar{cta, comm, ncclTeamTagLsa(), blockIdx.x};
bar.arrive(ncclCoopCta(), cuda::memory_order_relaxed);
bool waitNeeded = !EnableProfiler;`,
      commit(s){ s.bar = s.bar.map(() => "arrived"); } },
    { title: "② barrier 之前：先预取本地 seg r 到 acc0",
      desc: `在等待 peer 就绪之前，先把<b>本地</b>输入读进寄存器 <code>acc0</code>，用这段时间掩盖 barrier 的同步延迟。`,
      code: `nIters -= w;
if (0 < nIters) {
  for (int u = 0; u < UnrollPacks; u++)
    acc0[u] = inpPacks.peerPtr(world, rank)[u * WARP_SIZE];   // 本地
}
if (waitNeeded) bar.wait(ncclCoopCta(), cuda::memory_order_acquire);`,
      flows: (s, L) => [0, 1, 2, 3].map(i => { const c = L.G[i].cell(i), q = L.G[i].sq(i);
        return flow(cubic([c.x + c.w / 2, c.y + c.h], [c.x + c.w / 2, c.y + 60], [q.x + q.w / 2, q.y - 40], [q.x + q.w / 2, q.y]), C4[i]); }),
      commit(s){ for (let i = 0; i < 4; i++) s.acc[i] = [i]; } },
    { title: "③ bar.wait（acquire）：所有 peer 输入就绪",
      desc: `<code>bar.wait(acquire)</code> 确认所有 peer 都已经 arrive。acquire 语义保证之后读到的是 peer 写好的数据。<br><code>waitNeeded</code> 保证整个 kernel 只 wait 一次，后续各档处理都不再等待。`,
      code: `if (waitNeeded) bar.wait(ncclCoopCta(), cuda::memory_order_acquire);
...
waitNeeded = false;`,
      commit(s){ s.bar = s.bar.map(() => "passed"); } },
    { title: "④ 读 peer r+1：acc1 = acc0 ⊕ tmp1",
      desc: `从 <code>r = rank + 1</code> 开始访问 peer：GPU0 读 GPU1，GPU1 读 GPU2…… 同一时刻每张卡只有一个读者，没有热点。<br>
      累加类型 <code>Acc</code> 可以比 <code>T</code> 宽（<code>ncclSymkAccumType</code>），每次读到的数据先 <code>applyCast&lt;T,Acc&gt;</code> 再规约。`,
      code: `int r = rank + 1; if (r == nRanks) r = 0;
for (int u = 0; u < UnrollPacks; u++)
  tmp1[u] = inpPacks.peerPtr(world, r)[u * WARP_SIZE];   // NVLink load
for (int u = 0; u < UnrollPacks; u++)
  acc1[u] = applyReduce(red, applyCast<T,Acc>(acc0[u]),
                             applyCast<T,Acc>(tmp1[u]));`,
      flows: (s, L) => [0, 1, 2, 3].map(i => { const src = (i + 1) % 4; const c = L.G[src].cell(i), q = L.G[i].sq(src);
        const p0 = [c.x + c.w / 2, c.y], p3 = [q.x + q.w / 2, q.y]; return flow(arc(p0, p3, 132 - Math.abs(p3[0] - p0[0]) / 14), C4[src], { delay: i * .04 }); }),
      commit(s){ for (let i = 0; i < 4; i++) s.acc[i].push((i + 1) % 4); } },
    { title: "⑤ 剩余 peer 按 UnrollPeers = 2 一批：r+2、r+3",
      desc: `剩下的 peer 两个一批：<b>先连续发出两个 peer 的 load</b>，增加在途访存数来掩盖 NVLink 延迟，<b>然后统一规约</b>。<br>
      peer 数不能整除时，由 <code>partial</code> 分支处理尾部。nRanks = 4 时正好是一个完整批次（dr = 2）。`,
      code: `int dr = 2;
for (int partial = 0; partial <= 1; partial++)
  for (...; dr + UnrollPeers <= nRanks; dr += UnrollPeers) {
    Pack tmp1[UnrollPeers][UnrollPacks];
    for (int ur = 0; ur < UnrollPeers - partial; ur++) {
      for (int u ...) tmp1[ur][u] = inpPacks.peerPtr(world, r)[u * WARP_SIZE];
      r += 1; if (r == nRanks) r = 0;
    }
    for (int ur ...) for (int u ...)
      acc1[u] = applyReduce(red, acc1[u], applyCast<T,Acc>(tmp1[ur][u]));
  }`,
      flows: (s, L) => { const out = []; for (let i = 0; i < 4; i++) for (const d of [2, 3]){ const src = (i + d) % 4;
        const c = L.G[src].cell(i), q = L.G[i].sq(src); const p0 = [c.x + c.w / 2, c.y], p3 = [q.x + q.w / 2, q.y];
        out.push(flow(arc(p0, p3, 136 - Math.abs(p3[0] - p0[0]) / 11 - (d - 2) * 6), C4[src], { delay: (d - 2) * .12 + i * .03 })); } return out; },
      commit(s){ for (let i = 0; i < 4; i++) s.acc[i].push((i + 2) % 4, (i + 3) % 4); } },
    { title: "⑥ postOp → cast<T> → 只写本地 out",
      desc: `<code>applyPostOp</code>（例如 SumPostDiv 的除法）之后 <code>applyCast&lt;Acc,T&gt;</code>，<b>只写本地</b> out。<br>
      接着 <code>inpPacks += wn × tile</code> 进入下一个 tile，并把下一轮的本地 acc0 预取好（软件流水）。`,
      code: `for (int u ...) acc1[u] = applyPostOp(red, acc1[u]);
for (int u ...) acc0[u] = applyCast<Acc,T>(acc1[u]);
for (int u ...) outPacks.localPtr()[u * WARP_SIZE] = acc0[u];   // 本地 store
inpPacks += intptr_t(wn) * UnrollPacks * WARP_SIZE;
outPacks += intptr_t(wn) * UnrollPacks * WARP_SIZE;
nIters -= wn;
// 预取下一轮本地数据
for (int u ...) acc0[u] = inpPacks.peerPtr(world, rank)[u * WARP_SIZE];`,
      flows: (s, L) => [0, 1, 2, 3].map(i => { const g = L.G[i]; const q0 = g.sq(0), q3 = g.sq(3);

      至此每张卡的 out 都是 4 个 rank 对应段的规约结果。`,
      code: `if NCCL_IF_CONSTEXPR (EnableProfiler) ncclSymkProfilerPhase(args, ..._BEFORE_CLOSE);
bar.sync(ncclCoopCta(), cuda::memory_order_relaxed);`,
      commit(s){ s.bar = s.bar.map(() => "end"); } },

function tilingFigure(svg, x, y){
  T(svg, x, y, "一段 seg 的内部切分（reduce()）：三档 pack 宽度 + warp 轮转映射　示例：nBlocks = 2、每 block 4 warp → 全局 wn = 8", { size: 13, weight: 600 });
  const by = y + 16, h = 36; let cx = x;
  const seg = (w, fill, label, color) => { R(svg, cx, by, w - 2, h, fill, { rx: 4 }); T(svg, cx + (w - 2) / 2, by + 23, label, { anchor: "middle", size: 10.5, fill: color || "#e6edf3", weight: 600 }); cx += w; };
  const brace = (x0, x1, label, sub) => { E("path", { d: `M${x0} ${by + h + 6} v6 H${x1 - 2} v-6`, fill: "none", stroke: "#6e7681" }, svg);
    T(svg, (x0 + x1) / 2, by + h + 26, label, { anchor: "middle", size: 10.5, fill: "#c9d1d9" });
    if (sub) T(svg, (x0 + x1) / 2, by + h + 41, sub, { anchor: "middle", size: 10, fill: COL.muted }); };
  const x0 = cx; seg(46, "#3a4252", "pre"); const x1 = cx;
  for (let t = 0; t < 16; t++){ const g = t % 8; seg(44, `hsl(${222 - g * 12},38%,${33 + g * 2.5}%)`, `w${g}`); } const x2 = cx;
  for (let t = 0; t < 4; t++) seg(42, `hsl(${190 - t * 10},30%,46%)`, `w${t}`); const x3 = cx;
  seg(56, "#3a4252", "suffix"); const x4 = cx;
  brace(x0, x1, "reduceEnds", "逐元素");
  brace(x1, x2, "reduceDeep<16B, UnrollPacks=4(TMA:8), UnrollPeers=2>", "chunk = 4 warp × Unroll × 32 lane × 16B = 8KB（TMA 16KB），chunk 数截成 nRanks×nBlocks 的倍数");
  brace(x2, x3, "reduceDeep<4B,4,4>", "4B 对齐时");
  brace(x3, x4, "reduceEnds<8>", "尾部");
  T(svg, x, by + h + 66, "全局 warp 号 g = warp × nBlocks + block（flattenIx 让 warp 在 block 间轮转），warp g 依次处理 tile g, g+wn, g+2wn …；lane l 访问 pack l + 32u（合并访存）", { size: 11, fill: COL.muted });
}

      <label><input type="checkbox" id="pm" ${p.mm ? "checked" : ""}> multimem（LsaLDMC）</label>
      <span>（参数只影响上方的 warp 分配；下方时序固定为 R = 3）</span>`;
    const upd = () => { p.nWarps = Math.max(4, Math.min(32, +div.querySelector("#pw").value || 16)); p.L = Math.max(1, Math.min(8, +div.querySelector("#pl").value || 4));
      p.R = Math.max(2, Math.min(32, +div.querySelector("#pr").value || 3)); p.mm = div.querySelector("#pm").checked; rerender(); };
    div.querySelectorAll("input").forEach(i => i.onchange = upd);
  },
  init(){ return { t: 0 }; },
  draw(svg, s, L, sc){
    const p = sc.params, a = warpAlloc(p);
    T(svg, 30, 30, "rsAlgoHier：一个 CTA 内的 warp 角色分工与两级流水线", { size: 15, weight: 700 });
    T(svg, 30, 52, "2 个 stage，各占 1 个 GIN warp 和若干 worker warp；worker 数按两个 stage 的“读量”比例分配（读远多于写）", { size: 12.5, fill: COL.muted });
    const bw = Math.min(58, 1040 / p.nWarps), by = 74;
    for (let w = 0; w < p.nWarps; w++){
      let role = w === 0 ? 0 : (w <= a.s0w ? 1 : (w === a.s0w + 1 ? 3 : 4));
      const c = LANES[role].color;
      R(svg, 30 + w * bw, by, bw - 4, 34, c, { rx: 5, op: .9 });
      T(svg, 30 + w * bw + (bw - 4) / 2, by + 22, `w${w}`, { anchor: "middle", size: bw > 40 ? 11 : 9, fill: "#0b0f15", weight: 700 });
    }
    const f1 = p.L === 1 ? "lsa.nRanks == 1：Stage0 没有 worker，GIN warp 直接从用户输入零拷贝 put；其余 worker 全部归 Stage1"
      : `nWorkWarps = ${p.nWarps} − 2 = ${a.nWork}；s0 = ${p.mm ? "1" : "L"}·(R−1) = ${a.s0}；s1 = ${p.mm ? "1" : "L"} + R − 1 = ${a.s1}；stage0_nWorkWarps = round(${a.nWork}·${a.s0}/${a.s0 + a.s1}) = ${a.s0w}`;
    T(svg, 30, by + 56, f1, { size: 12, fill: "#c9d1d9", mono: true });
    T(svg, 30, by + 76, `→ Stage0：1 GIN + ${a.s0w} worker；Stage1：1 GIN + ${a.s1w} worker（min(·, nWorkWarps−1)，保证 Stage1 至少有 1 个 worker）`, { size: 12, fill: COL.muted });

    const gx = 210, gy = 196, lh = 70, sx = 62, x = t => gx + t * sx;
    T(svg, 30, gy - 12, "时序示意（R = 3，每个 chunk 2 个 step，每批 nSteps = 1；非实测）", { size: 12.5, weight: 600, fill: "#c9d1d9" });
    LANES.forEach((ln, i) => { const y = gy + i * lh;
      R(svg, 24, y + 4, 1056, lh - 8, i % 2 ? "#0f141d" : "#121823", { rx: 8 });
      R(svg, 30, y + 16, 6, lh - 32, ln.color, { rx: 2 });
      T(svg, 44, y + 30, ln.name, { size: 12.5, weight: 700, fill: ln.color });
      T(svg, 44, y + 47, ln.sub, { size: 10.5, fill: COL.muted }); });
    for (let t = 0; t <= 13; t++){ E("line", { x1: x(t), y1: gy, x2: x(t), y2: gy + 5 * lh, stroke: "#1f2735" }, svg);
      T(svg, x(t), gy + 5 * lh + 16, `${t}`, { anchor: "middle", size: 10, fill: COL.muted, mono: true }); }
    const now = s.t;
    EV.forEach(e => { const li = LANES.findIndex(l => l.k === e.lane); const ln = LANES[li]; const y = gy + li * lh + 12;
      const st = e.t1 <= now ? "done" : (e.t0 < now ? "act" : "todo");
      const op = st === "todo" ? .16 : (e.c ? .62 : .95);
      R(svg, x(e.t0) + 1, y, x(e.t1) - x(e.t0) - 2, lh - 24, ln.color, { rx: 5, op, stroke: st === "act" ? "#ffffff" : undefined, sw: 2 });
      const w = x(e.t1) - x(e.t0);
      if (w > 40) T(svg, x(e.t0) + w / 2, y + 20, `${e.lab}`, { anchor: "middle", size: 11, fill: "#0b0f15", weight: 700, op: st === "todo" ? .4 : 1 });
      if (w > 40) T(svg, x(e.t0) + w / 2, y + 36, `chunk${e.c}`, { anchor: "middle", size: 9.5, fill: "#0b0f15", op: st === "todo" ? .35 : .8 });
      else T(svg, x(e.t0) + w / 2, y + 26, e.lab, { anchor: "middle", size: 9, fill: "#0b0f15", weight: 700, op: st === "todo" ? .4 : 1 }); });
    E("line", { x1: x(now), y1: gy - 4, x2: x(now), y2: gy + 5 * lh + 4, stroke: COL.accent, "stroke-width": 2.2 }, svg);
    E("path", { d: `M${x(now) - 6} ${gy - 10} h12 l-6 8 z`, fill: COL.accent }, svg);
    T(svg, 30, 628, "观察：Stage0 处理 chunk1 的 LSA 规约时，chunk0 的数据还在网络上，Stage1 也在累加，三件事同时进行。chunk 大小默认 128KB（NCCL_SYM_RS_GIN_CHUNK_SIZE），", { size: 11.5, fill: COL.muted });
    T(svg, 30, 646, "每 block accum = 2×chunk，inbox 容量按带宽时延积 ginBw × (ginLat + smLat) 估算，所以单个 CTA 内能有足够多的 put 同时在途。", { size: 11.5, fill: COL.muted });
  },
  steps: [],
  legend: `实色 = chunk0，半透明 = chunk1，白框 = 当前时间片正在执行。上方 warp 条带的颜色与下方泳道一一对应。`,
};
(function buildPSteps(){
  sP.steps.push({ title: "初始：warp 角色与两级流水线",
    desc: `<code>rsAlgoHier</code> 把一个 CTA 的 warp 分成 <b>2 个 stage × 2 种角色</b>：<ul>
      <li><b>Stage0</b>（发送侧）：GIN warp 负责 <code>postSends</code>；worker 负责节点内规约，写入 outbox</li>
      <li><b>Stage1</b>（接收侧）：GIN warp 负责 <code>finishRecvs</code> 归还 credit；worker 负责 accum 的累加和写出</li></ul>
      两个 stage 用各自的 <code>ncclCoopWarpSpan</code> 同步，彼此只通过 inbox 和 outbox 的信号耦合，所以能跨 chunk 流水执行。可以修改上方参数，观察 warp 分配的变化。`,
    code: `int nWorkWarps = blockDim.x / 32 - 2;
int stage0_work = (multimem ? 1 : lsa.nRanks) * (rail.nRanks - 1);
int stage1_work = (multimem ? 1 : lsa.nRanks) + rail.nRanks - 1;
stage0_nWorkWarps = __float2int_rn(__fdividef(nWorkWarps * stage0_work,
                                              stage0_work + stage1_work));
stage0_nWorkWarps = min(stage0_nWorkWarps, nWorkWarps - 1);
int stage = threadIdx.x / 32 < 1 + stage0_nWorkWarps ? 0 : 1;
bool roleIsWorker = 32 <= coopStage.thread_rank();` });
  for (let t = 1; t <= 13; t++){
    const act = EV.filter(e => e.t0 < t && e.t1 > t - 1);
    sP.steps.push({ title: `时间片 t ∈ [${t - 1}, ${t})`,
      desc: `<ul>${act.map(e => { const ln = LANES.find(l => l.k === e.lane); return `<li><b style="color:${ln.color}">${ln.name}</b>：${e.d}</li>`; }).join("")}</ul>`,
      code: `// skeleton(initFn, stepFn, finishFn)
while (loopElts != 0) {
  int nChunkElts = min(loopElts, (size_t)maxChunkElts);
  int nSteps = min(rail.nRanks - 1, 1 << (nBufs_log2 - 1));
  int step = 0;
  initFn(nChunkElts, loopInput);
  do {
    nSteps = min(nSteps, rail.nRanks - 1 - step);
    stepFn(step, nSteps, nChunkElts, loopInput);
    step += nSteps;
  } while (step != rail.nRanks - 1);
  finishFn(nChunkElts, loopOutput);
  inbox.endRound(cta);
  loopInput += nChunkElts; loopOutput += nChunkElts; loopElts -= nChunkElts;
}`,
      commit(s){ s.t = t; }, tween: (s, p) => ({ t: s.t + p }) });
  }
})();

/* ============================== 播放引擎 ============================== */
const SCENES = [sLD, sTMA, sMC, sLL, sX, sP];
const svg = document.getElementById("svg");
let SC = null, IDX = 0, PLAY = false, SPEED = 1, ANIM = null, TIMER = null;

function clearSvg(){ while (svg.firstChild) svg.removeChild(svg.firstChild); }
function stateAt(sc, i){ const s = sc.init(); for (let j = 0; j <= i; j++){ const c = sc.steps[j].commit; if (c) c(s, sc); } return s; }
function flowsAt(sc, i){ if (i <= 0) return []; const f = sc.steps[i].flows; return f ? f(stateAt(sc, i - 1), sc.L, sc) : []; }
function drawScene(st){ clearSvg(); SC.draw(svg, st, SC.L, SC); return E("g", { "pointer-events": "none" }, svg); }
function stopAnim(){ if (ANIM) cancelAnimationFrame(ANIM); ANIM = null; if (TIMER) clearTimeout(TIMER); TIMER = null; }
function render(){
  stopAnim();
  const ov = drawScene(stateAt(SC, IDX));
  const fl = flowsAt(SC, IDX); fl.forEach(f => updFlow(f, mkFlowEls(ov, f), 1, true));
  panel();
}
function panel(){
  const st = SC.steps[IDX];
  document.getElementById("stepno").textContent = `STEP ${IDX} / ${SC.steps.length - 1}`;
  document.getElementById("stitle").textContent = st.title;
  document.getElementById("sdesc").innerHTML = typeof st.desc === "function" ? st.desc(SC) : (st.desc || "");
  document.getElementById("scode").textContent = st.code || "";
  const pg = document.getElementById("progress"); pg.innerHTML = "";
  SC.steps.forEach((_, i) => { const d = document.createElement("i"); d.className = i < IDX ? "done" : (i === IDX ? "cur" : ""); d.title = SC.steps[i].title;
    d.onclick = () => { PLAY = false; updPlay(); IDX = i; render(); }; pg.appendChild(d); });
}
function next(){
  if (IDX >= SC.steps.length - 1){ PLAY = false; updPlay(); return; }
  stopAnim();
  const from = IDX, to = IDX + 1, step = SC.steps[to];
  const st = stateAt(SC, from), flows = flowsAt(SC, to);
  IDX = to; panel();
  let ov = drawScene(st); let els = flows.map(f => mkFlowEls(ov, f));
  const dur = (flows.length || step.tween ? 1600 : 500) / SPEED, t0 = performance.now();
  const frame = now => {
    const p = Math.min(1, (now - t0) / dur);
    if (step.tween){ ov = drawScene(step.tween(st, p)); els = flows.map(f => mkFlowEls(ov, f)); }
    els.forEach((e, i) => updFlow(flows[i], e, p, false));
    if (p < 1) ANIM = requestAnimationFrame(frame);
    else { ANIM = null; render(); if (PLAY) TIMER = setTimeout(next, 700 / SPEED); }
  };
  ANIM = requestAnimationFrame(frame);
}
function prev(){ PLAY = false; updPlay(); IDX = Math.max(0, IDX - 1); render(); }
function reset(){ PLAY = false; updPlay(); IDX = 0; render(); }
function togglePlay(){
  PLAY = !PLAY; updPlay();
  if (PLAY){ if (IDX >= SC.steps.length - 1){ IDX = 0; render(); } next(); }
  else render();
}
function updPlay(){ document.getElementById("bPlay").textContent = PLAY ? "⏸ 暂停" : "▶ 播放"; }
function selectScene(sc){
  stopAnim(); PLAY = false; updPlay();
  SC = sc; SC.L = SC.layout ? SC.layout() : {};
  svg.setAttribute("viewBox", `0 0 ${SC.vb[0]} ${SC.vb[1]}`);
  const cd = document.getElementById("sceneControls"); cd.innerHTML = "";
  if (SC.controls) SC.controls(cd, () => render());
  document.getElementById("legend").innerHTML = SC.legend || "";
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.id === sc.id));
  IDX = 0; render();
  history.replaceState(null, "", "#" + sc.id);
}
const tabs = document.getElementById("tabs");
SCENES.forEach(sc => { const b = document.createElement("button"); b.textContent = sc.tab; b.dataset.id = sc.id; b.onclick = () => selectScene(sc); tabs.appendChild(b); });
document.getElementById("bNext").onclick = () => { PLAY = false; updPlay(); next(); };
document.getElementById("bPrev").onclick = prev;
document.getElementById("bReset").onclick = reset;
document.getElementById("bPlay").onclick = togglePlay;
const spd = document.getElementById("speed");
spd.oninput = () => { SPEED = +spd.value; document.getElementById("speedv").textContent = SPEED + "×"; };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.key === "ArrowRight"){ PLAY = false; updPlay(); next(); }
  else if (e.key === "ArrowLeft") prev();
  else if (e.key === " "){ e.preventDefault(); togglePlay(); }
  else if (e.key === "Home") reset();
});
selectScene(SCENES.find(s => "#" + s.id === location.hash) || SCENES[0]);
</script>
